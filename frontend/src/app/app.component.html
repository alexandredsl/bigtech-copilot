<main>
  <header>
    <h1>bigtech-copilot</h1>
    <p class="muted">Dashboard de big techs com copiloto de IA ancorado em dado real via function calling (MCP + OpenCode)</p>
  </header>

  <section class="cards-row">
    @for (t of tickers; track t) {
      <app-stock-card [ticker]="t" />
    }
  </section>

  <section class="chart-section">
    <div class="chart-controls">
      <p-selectButton
        [options]="tickerOptions"
        [(ngModel)]="chartTicker"
        optionLabel="label"
        optionValue="value"
        [allowEmpty]="false"
      />
    </div>
    <app-price-chart [ticker]="chartTicker" />
  </section>

  <section class="chat-row">
    <app-chat-panel />
  </section>
</main>
