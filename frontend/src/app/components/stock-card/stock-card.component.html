<button
  type="button"
  class="card panel"
  [class.selected]="selected"
  [style.--tint]="meta().color"
  [attr.aria-pressed]="selected"
  [attr.aria-label]="'Ver gráfico de ' + ticker + ' — ' + meta().name"
  (click)="select.emit(ticker)"
>
  @if (loading()) {
    <div class="row">
      <div class="skeleton" style="width: 58px; height: 16px"></div>
      <div class="skeleton" style="width: 46px; height: 12px"></div>
    </div>
    <div class="skeleton" style="width: 120px; height: 30px; margin-top: 10px"></div>
    <div class="skeleton" style="width: 100%; height: 4px; margin-top: 18px"></div>
    <div class="skeleton" style="width: 100%; height: 28px; margin-top: 16px"></div>
    <span class="sr-only">Carregando {{ ticker }}</span>
  } @else if (error()) {
    <div class="failure">
      <span class="sym">{{ ticker }}</span>
      <p>{{ error() }}</p>
      <span class="retry" (click)="retry($event)"><i class="pi pi-replay" aria-hidden="true"></i> Tentar de novo</span>
    </div>
  } @else {
    <header class="row head">
      <span class="sym">{{ ticker }}</span>
      <span class="state" [class.open]="isOpen()">
        <span class="dot" aria-hidden="true"></span>{{ stateLabel() }}
      </span>
    </header>

    <span class="name">{{ overview()?.shortName ?? meta().name }}</span>

    <div class="price-row" [class.flash-up]="flash() === 'up'" [class.flash-down]="flash() === 'down'">
      <span class="price num">{{ money(quote()?.price) }}</span>
      <span class="delta num" [class.up]="isUp()" [class.down]="!isUp()">
        <span class="pct">{{ percent(quote()?.changePercent) }}</span>
        <span class="abs">{{ signedMoney(quote()?.change) }}</span>
      </span>
    </div>

    @if (dayPosition() !== null) {
      <div class="range">
        <div class="labels">
          <span class="num">{{ money(quote()?.dayLow) }}</span>
          <span>faixa do dia</span>
          <span class="num">{{ money(quote()?.dayHigh) }}</span>
        </div>
        <div class="track">
          <span class="marker" [style.left.%]="dayPosition()"></span>
        </div>
      </div>
    }

    <dl class="stats">
      <div>
        <dt>Valor de mercado</dt>
        <dd class="num">{{ compact(overview()?.marketCap) }}</dd>
      </div>
      <div>
        <dt>P/L</dt>
        <dd class="num">{{ num(overview()?.peRatio, 1) }}</dd>
      </div>
    </dl>

    @if (rangePosition() !== null) {
      <div class="range wide">
        <div class="labels">
          <span>52 semanas</span>
          <span class="num pos">{{ num(rangePosition(), 0) }}% da faixa</span>
        </div>
        <div class="track">
          <span class="fill" [style.width.%]="rangePosition()"></span>
          <span class="marker tinted" [style.left.%]="rangePosition()"></span>
        </div>
      </div>
    }

    <footer class="meta">
      <span>{{ quote()?.source }}</span>
      <span class="num">{{ clock(quote()?.asOf) }} · {{ ago() }}</span>
    </footer>
  }
</button>
